# Base de données locale (ADR-008). Démarrage : docker compose up -d
services:
  db:
    image: postgres:18
    container_name: jobhunt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: jobhunt
      POSTGRES_DB: jobhunt
      # Le tri « C » suffit ici et évite les écarts de collation entre versions de l'image.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # Jamais exposé au réseau : l'app tourne sur la même machine.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 : PGDATA = /var/lib/postgresql/18/docker et VOLUME = /var/lib/postgresql.
      # Monter /var/lib/postgresql (et non .../data) est obligatoire depuis cette version.
      - jobhunt-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt -d jobhunt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  jobhunt-pgdata:
